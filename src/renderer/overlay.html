<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' http://127.0.0.1:* ws://127.0.0.1:*; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' http://127.0.0.1:* ws://127.0.0.1:*;">
<title>NeuroStream Studio — Оверлей для OBS</title>
<style>
  html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; width: 100vw; height: 100vh; }
  #alert-root {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 14px;
    opacity: 0; transform: translateY(16px) scale(0.96);
    transition: opacity 0.35s ease, transform 0.35s ease;
    font-family: 'Segoe UI', sans-serif;
  }
  #alert-root.visible { opacity: 1; transform: translateY(0) scale(1); }
  #alert-root .alert-media { max-width: 480px; max-height: 360px; filter: drop-shadow(0 6px 24px rgba(0,0,0,0.5)); }
  #alert-root .alert-text {
    color: #fff; font-size: 26px; font-weight: 700;
    text-shadow: 0 2px 10px rgba(0,0,0,0.85), 0 0 20px rgba(0,0,0,0.6);
    text-align: center; max-width: 700px;
  }
  #custom-widget-css {}
</style>
<style id="custom-widget-css"></style>
</head>
<body>
  <div id="alert-root">
    <div class="alert-media-slot"></div>
    <div class="alert-text"></div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script type="module" src="js/overlay.js"></script>
</body>
</html>
